<style>
.gallery {
  position: relative;
  width: 100%;
  padding: 16px;
}

.gallery-item {
  position: absolute;
  width: calc((100% - 24px) / 3);
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 0;
}

/* Tablet */
@media (max-width: 1024px) {
  .gallery-item {
    width: calc((100% - 12px) / 2);
  }
}

/* HP */
@media (max-width: 768px) {
  .gallery-item {
    width: 100%;
  }
}
</style>

<script>
function arrangeGallery() {
    const gallery = document.querySelector('.gallery');
    const items = document.querySelectorAll('.gallery-item');

    if (!gallery || items.length === 0) return;

    const galleryWidth = gallery.clientWidth;
    const gap = 12;

    let columns = 3;

    if (window.innerWidth <= 768) {
        columns = 1;
    } else if (window.innerWidth <= 1024) {
        columns = 2;
    }

    const columnWidth = (galleryWidth - (gap * (columns - 1))) / columns;

    let columnHeights = new Array(columns).fill(0);

    items.forEach((item, index) => {
        const column = index % columns;

        const x = column * (columnWidth + gap);
        const y = columnHeights[column];

        item.style.width = columnWidth + 'px';
        item.style.left = x + 'px';
        item.style.top = y + 'px';

        columnHeights[column] += item.offsetHeight + gap;
    });

    gallery.style.height = Math.max(...columnHeights) + 'px';
}

window.addEventListener('load', arrangeGallery);
window.addEventListener('resize', arrangeGallery);
</script>
